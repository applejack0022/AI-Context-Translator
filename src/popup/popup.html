<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Context Translator</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">AI Context Translator</h1>

    <div class="popup-section">
      <label for="quick-text">快速翻译</label>
      <textarea id="quick-text" rows="3" placeholder="输入要翻译的文字"></textarea>
      <button id="quick-translate-btn" class="primary-btn">翻译</button>
    </div>

    <div class="popup-section">
      <label for="popup-mode">翻译模式</label>
      <select id="popup-mode">
        <option value="literal">直译模式（省 token）</option>
        <option value="balanced">平衡模式（+ 解释）</option>
        <option value="explain">梗解释模式</option>
      </select>
    </div>

    <div class="popup-section">
      <label for="popup-target-language">目标语言</label>
      <select id="popup-target-language">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="popup-section checkbox-only">
      <label class="checkbox-label">
        <input type="checkbox" id="popup-auto-translate" />
        <span>自动翻译当前可见内容</span>
      </label>
    </div>

    <div class="popup-section">
      <button id="open-options-btn" class="secondary-btn">详细设置</button>
      <button id="clear-cache-btn" class="secondary-btn">清空缓存</button>
    </div>

    <div class="popup-section usage-section">
      <div class="usage-header">
        <span class="usage-title">Token 用量</span>
        <button id="reset-usage-btn" class="text-btn">重置</button>
      </div>
      <div class="usage-grid">
        <div class="usage-item">
          <span class="usage-value" id="usage-today">-</span>
          <span class="usage-label">今日</span>
        </div>
        <div class="usage-item">
          <span class="usage-value" id="usage-total">-</span>
          <span class="usage-label">累计</span>
        </div>
        <div class="usage-item">
          <span class="usage-value" id="usage-count">-</span>
          <span class="usage-label">次数</span>
        </div>
      </div>
    </div>

    <div id="result-area" class="result-area hidden"></div>
    <div id="status-area" class="status-area"></div>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
