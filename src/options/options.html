<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Context Translator 设置</title>
  <link rel="stylesheet" href="./options.css" />
</head>
<body>
  <div class="options-container">
    <h1>AI Context Translator 设置</h1>

    <div class="form-group">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="sk-..." />
      <p class="hint">你的 API Key 只保存在本地，不会上传到任何服务器。</p>
    </div>

    <div class="form-group">
      <label for="provider">服务商</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gemini">Gemini (OpenAI 兼容)</option>
        <option value="custom">自定义</option>
      </select>
    </div>

    <div class="form-group">
      <label for="api-url">API URL</label>
      <input type="text" id="api-url" placeholder="https://api.openai.com/v1/chat/completions" />
    </div>

    <div class="form-group">
      <label for="model">模型</label>
      <input type="text" id="model" placeholder="gpt-3.5-turbo" />
      <p class="hint">选择服务商会自动填充推荐模型，选择「自定义」可手动输入。</p>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="temperature">Temperature</label>
        <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7" />
      </div>
      <div class="form-group">
        <label for="max-tokens">Max Tokens</label>
        <input type="number" id="max-tokens" min="100" max="4096" step="1" value="1024" />
      </div>
    </div>

    <div class="form-group">
      <label for="mode">翻译模式</label>
      <select id="mode">
        <option value="literal">直译模式（默认，最省 token）</option>
        <option value="balanced">平衡模式（翻译 + 简要解释）</option>
        <option value="explain">梗解释模式</option>
      </select>
    </div>

    <div class="form-group">
      <label for="target-language">目标语言</label>
      <select id="target-language">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
      <p class="hint">翻译结果将输出为所选语言。</p>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="auto-translate" />
        <span>自动翻译当前窗口可见内容</span>
      </label>
      <p class="hint">开启后，滚动页面时会自动翻译进入视口的帖子/楼层。</p>
    </div>

    <div class="form-actions">
      <button id="save-btn" class="primary-btn">保存设置</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="./options.js"></script>
</body>
</html>
